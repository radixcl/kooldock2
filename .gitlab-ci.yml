# GitLab CI pipeline for KoolDock2
# Builds on Ubuntu 24.04 LTS and produces a .deb package artifact.
#
# To use this pipeline:
# 1. Enable CI/CD in your GitLab project settings
# 2. Ensure you have a GitLab Runner with Docker executor available
#
# The generated .deb can be downloaded from the pipeline artifacts
# and installed with:  sudo dpkg -i kooldock2-*.deb

stages:
  - build

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_SUBMODULE_STRATEGY: recursive

# ── Ubuntu 24.04 LTS (Noble) build ──────────────────────────────
# Uses the latest Ubuntu LTS image with KDE Plasma 6 / Qt 6 packages.
# The same pipeline works for Kubuntu 24.04 and later.

build:noble:
  stage: build
  image: ubuntu:24.04
  artifacts:
    name: "kooldock2-${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    paths:
      - build/*.deb
    expire_in: 90 days
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        build-essential
        cmake
        extra-cmake-modules
        qt6-base-dev
        qt6-declarative-dev
        qt6-wayland
        qt6-tools-dev
        qt6-tools-dev-tools
        libqt6quickcontrols2-6
        qml6-module-qtquick-controls
        qml6-module-qt-labs-platform
        libkf6coreaddons-dev
        libkf6config-dev
        libkf6crash-dev
        libkf6dbusaddons-dev
        libkf6windowsystem-dev
        libkf6service-dev
        libkf6package-dev
        libkf6iconthemes-dev
        libkf6kio-dev
        libkf6xmlgui-dev
        libkf6i18n-dev
        libkf6colorscheme-dev
        libkf6kirigami2-dev
        liblayershellqtinterface-dev
        libwayland-dev
        libxcb1-dev
        libxcb-util-dev
        libxcb-shape0-dev
        libxcb-randr0-dev
        libxcb-xfixes0-dev
        libxcb-damage0-dev
        libxcb-sync-dev
        libxcb-present-dev
        libxcb-shm0-dev
        libxcb-render0-dev
        libegl1-mesa-dev
        libglx-dev
        libopengl-dev
        pkg-config
    - apt-get clean
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build build --parallel $(nproc)
    # Package as .deb via CPack
    - cd build
    - cpack -G DEB --config CPackConfig.cmake 2>/dev/null || cpack -G DEB 2>/dev/null || echo "CPack not configured; binary available at build/bin/kooldock2"
    # Fallback: copy binary if cpack fails
    - mkdir -p artifacts
    - cp -v bin/kooldock2 artifacts/ 2>/dev/null || true
    - cp -v *.deb artifacts/ 2>/dev/null || true
    - cp -rv artifacts ../build/artifacts 2>/dev/null || true
