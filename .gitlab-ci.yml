# GitLab CI pipeline for KoolDock2
# Builds on Ubuntu (resolute / 26.04 LTS) and produces a .deb package artifact.
#
# To use this pipeline:
# 1. Enable CI/CD in your GitLab project settings
# 2. Ensure you have a GitLab Runner with Docker executor available
#
# Pipeline triggers on every push to dev/main and on tags (releases).
# The generated .deb can be downloaded from the pipeline artifacts
# and installed with:  sudo dpkg -i kooldock2-*.deb

stages:
  - build
  - deploy

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_SUBMODULE_STRATEGY: recursive
  # Target Ubuntu release by codename (resolute = 26.04 LTS). Used for both
  # the build image tag and the artifact name; bump this one value to retarget.
  UBUNTU_CODENAME: resolute

# ── Ubuntu resolute (26.04 LTS) / KDE Plasma 6 / Qt 6 ─────────
# Compatible with Kubuntu 26.04+ / KDE Plasma 6 / Qt 6 ≥ 6.6.
# Runs on every push to dev/main and on version tags.

build:ubuntu:
  stage: build
  image: ubuntu:${UBUNTU_CODENAME}
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  artifacts:
    name: "kooldock2-${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}-${UBUNTU_CODENAME}-amd64"
    paths:
      - build/*.deb
    expire_in: 90 days
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        build-essential
        file
        cmake
        extra-cmake-modules
        qt6-base-dev
        qt6-declarative-dev
        qt6-wayland
        qt6-tools-dev
        qt6-tools-dev-tools
        libqt6quickcontrols2-6
        qml6-module-qtquick-controls
        qml6-module-qt-labs-platform
        libkf6coreaddons-dev
        libkf6config-dev
        libkf6crash-dev
        libkf6dbusaddons-dev
        libkf6windowsystem-dev
        libkf6service-dev
        libkf6package-dev
        libkf6iconthemes-dev
        libkf6kio-dev
        libkf6xmlgui-dev
        libkf6i18n-dev
        libkf6colorscheme-dev
        kwayland-dev
        liblayershellqtinterface-dev
        libsm-dev
        libice-dev
        plasma-wayland-protocols
        libwayland-dev
        libxcb1-dev
        libxcb-util-dev
        libxcb-shape0-dev
        libxcb-randr0-dev
        libxcb-xfixes0-dev
        libxcb-damage0-dev
        libxcb-sync-dev
        libxcb-present-dev
        libxcb-shm0-dev
        libxcb-render0-dev
        libegl1-mesa-dev
        libglx-dev
        libopengl-dev
        pkg-config
    - apt-get clean
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build build --parallel $(nproc)
    - cd build && cpack -G DEB

# ── APT repository on GitLab Pages ────────────────────────────
# Publishes the built .deb into a signed APT repo served at
#   https://<namespace>.gitlab.io/<project>/
# Runs only on tags (releases). Requires two CI/CD variables:
#   GPG_PRIVATE_KEY  (File)     ASCII-armored private signing key, no passphrase
#   GPG_KEY_ID       (Variable) the signing key's id/fingerprint
# The matching public key is published at the repo root as kooldock.gpg.key.
#
# History note: the pool/db are kept in CI cache (best-effort on shared
# runners) so older versions accumulate. For guaranteed retention across
# releases, persist reprepro/db and reprepro/pool in the Generic Package
# Registry instead of the cache.
pages:
  stage: deploy
  image: ubuntu:${UBUNTU_CODENAME}
  needs: ["build:ubuntu"]
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key: apt-repo
    paths:
      - reprepro/db
      - reprepro/pool
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq reprepro gnupg gettext-base
    - gpg --batch --import "$GPG_PRIVATE_KEY"
  script:
    - export UBUNTU_CODENAME GPG_KEY_ID
    - envsubst '$UBUNTU_CODENAME $GPG_KEY_ID'
        < reprepro/conf/distributions.in > reprepro/conf/distributions
    - reprepro -b reprepro includedeb "$UBUNTU_CODENAME" build/*.deb
    - mkdir -p public
    - cp -a reprepro/dists reprepro/pool public/
    - gpg --batch --armor --export "$GPG_KEY_ID" > public/kooldock.gpg.key
  artifacts:
    paths:
      - public
